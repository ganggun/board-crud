spring:
  application:
    name: school-predict
  datasource:
    url: ${DB_URL:jdbc:h2:mem:school_predict;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:temporary-one-off-secret-temporary-one-off-secret}
    expires-in: ${JWT_EXPIRES_IN:5d}
  odds:
    min: ${ODDS_MIN:1.10}
    max: ${ODDS_MAX:5.00}
